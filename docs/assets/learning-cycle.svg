<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 278" width="920" height="278" role="img" aria-label="Evidence-Led Five-Stage Learning Loop">
  <defs>
    <linearGradient id="loopBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#F2ECE0"/>
    </linearGradient>
    <marker id="arrowForest" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#143628"/>
    </marker>
    <marker id="arrowTerra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9E4424"/>
    </marker>
    <radialGradient id="goldDot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#143628" stop-opacity="1"/>
      <stop offset="55%" stop-color="#C9A24B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="278" rx="16" fill="url(#loopBg)"/>
  <rect x="0.75" y="0.75" width="918.5" height="276.5" rx="15.5" fill="none" stroke="#143628" stroke-opacity="0.18" stroke-width="1.4"/>

  <!-- Header -->
  <text x="28" y="34" fill="#9E4424" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">COGNITIVE-SCIENCE WORKFLOW · NO CRAMMING · NO GUESSING</text>
  <text x="28" y="58" fill="#143628" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">How Every Child Builds Real, Lasting Mastery</text>

  <!-- 5 Equal Cards: width=148, gap=31 (x: 28, 207, 386, 565, 744; y=82..190, height=108) -->
  <!-- Step 1 -->
  <g transform="translate(28, 82)">
    <rect x="0" y="0" width="148" height="108" rx="12" fill="#FFFFFF" stroke="#143628" stroke-opacity="0.24" stroke-width="1.2"/>
    <rect x="14" y="16" width="54" height="20" rx="10" fill="#143628"/>
    <text x="41" y="29.5" text-anchor="middle" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">STEP 1</text>
    <text x="14" y="57" fill="#143628" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Teach First</text>
    <text x="14" y="75" fill="#3D5248" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">Visual 3-step method</text>
    <text x="14" y="90" fill="#3D5248" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">&amp; worked example</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(207, 82)">
    <rect x="0" y="0" width="148" height="108" rx="12" fill="#FFFFFF" stroke="#143628" stroke-opacity="0.24" stroke-width="1.2"/>
    <rect x="14" y="16" width="54" height="20" rx="10" fill="#143628"/>
    <text x="41" y="29.5" text-anchor="middle" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">STEP 2</text>
    <text x="14" y="57" fill="#143628" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Focus Sprint</text>
    <text x="14" y="75" fill="#3D5248" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">Calm 5m → 40m ladder</text>
    <text x="14" y="90" fill="#3D5248" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">with Lexend &amp; tints</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(386, 82)">
    <rect x="0" y="0" width="148" height="108" rx="12" fill="#FFFFFF" stroke="#C9A24B" stroke-width="1.6"/>
    <rect x="14" y="16" width="54" height="20" rx="10" fill="#9E4424"/>
    <text x="41" y="29.5" text-anchor="middle" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">STEP 3</text>
    <text x="14" y="57" fill="#143628" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Socratic Coach</text>
    <text x="14" y="75" fill="#3D5248" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">Guiding hints only;</text>
    <text x="14" y="90" fill="#3D5248" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">never leaks answers</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(565, 82)">
    <rect x="0" y="0" width="148" height="108" rx="12" fill="#FFFFFF" stroke="#143628" stroke-opacity="0.24" stroke-width="1.2"/>
    <rect x="14" y="16" width="54" height="20" rx="10" fill="#143628"/>
    <text x="41" y="29.5" text-anchor="middle" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">STEP 4</text>
    <text x="14" y="57" fill="#143628" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Adaptive Mock</text>
    <text x="14" y="75" fill="#3D5248" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">ISEB-style Rasch IRT</text>
    <text x="14" y="90" fill="#3D5248" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">with Coach locked off</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(744, 82)">
    <rect x="0" y="0" width="148" height="108" rx="12" fill="#143628" stroke="#C9A24B" stroke-width="1.6"/>
    <rect x="14" y="16" width="66" height="20" rx="10" fill="#E5C77B"/>
    <text x="47" y="29.5" text-anchor="middle" fill="#0E251C" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">VERIFIED</text>
    <text x="14" y="57" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">3-Day Mastery</text>
    <text x="14" y="75" fill="#D5E8DE" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">Proven across 3 days</text>
    <text x="14" y="90" fill="#D5E8DE" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5">HMAC-verified ledger</text>
  </g>

  <!-- Cleanly spaced arrows with 6px clearance on both ends -->
  <path d="M 182 136 L 200 136" stroke="#143628" stroke-width="1.8" marker-end="url(#arrowForest)"/>
  <path d="M 361 136 L 379 136" stroke="#143628" stroke-width="1.8" marker-end="url(#arrowForest)"/>
  <path d="M 540 136 L 558 136" stroke="#143628" stroke-width="1.8" marker-end="url(#arrowForest)"/>
  <path d="M 719 136 L 737 136" stroke="#143628" stroke-width="1.8" marker-end="url(#arrowForest)"/>

  <!-- Symmetrical Spaced-Repetition Return Loop (starts bottom centre of Step 5 x=818, returns cleanly to bottom centre of Step 2 x=281) -->
  <path d="M 818 195 L 818 232 Q 818 242 808 242 L 291 242 Q 281 242 281 232 L 281 198" fill="none" stroke="#9E4424" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowTerra)"/>

  <!-- Animated mastery pulse starts cleanly centred on Step 5 bottom edge and follows the exact rounded loop -->
  <circle cx="818" cy="195" r="3.8" fill="url(#goldDot)">
    <animateMotion dur="5.2s" repeatCount="indefinite" path="M 0 0 L 0 37 Q 0 47 -10 47 L -527 47 Q -537 47 -537 37 L -537 5"/>
  </circle>

  <!-- Generously sized high-contrast pill centred cleanly on the bottom segment (x=549.5) -->
  <rect x="372" y="228" width="355" height="28" rx="14" fill="#FCEEE7" stroke="#9E4424" stroke-width="1.3"/>
  <text x="549.5" y="245.5" text-anchor="middle" fill="#6E2810" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Spaced-Repetition Review · Zero Single-Day Cramming</text>
</svg>

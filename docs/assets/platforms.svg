<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 248" width="920" height="248" role="img" aria-label="Choose Your Device: Apple Mac, Windows 10 and 11, or Chromebook and Web">
  <defs>
    <linearGradient id="platBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#F2ECE0"/>
    </linearGradient>
    <linearGradient id="macCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173D2D"/>
      <stop offset="100%" stop-color="#0E281E"/>
    </linearGradient>
    <linearGradient id="winCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D3E52"/>
      <stop offset="100%" stop-color="#122735"/>
    </linearGradient>
    <linearGradient id="chrCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A3B24"/>
      <stop offset="100%" stop-color="#532615"/>
    </linearGradient>
  </defs>

  <rect width="920" height="248" rx="16" fill="url(#platBg)"/>
  <rect x="0.75" y="0.75" width="918.5" height="246.5" rx="15.5" fill="none" stroke="#143628" stroke-opacity="0.18" stroke-width="1.4"/>

  <!-- Header with generous line spacing and crisp lining numerals -->
  <text x="28" y="32" fill="#9E4424" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">CHOOSE YOUR FAMILY DEVICE · SAME ENGINE EVERYWHERE</text>
  <text x="28" y="60" fill="#143628" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">Ready in Under 60 Seconds on Mac, Windows, or Chromebook</text>

  <!-- Three Equal Cards (y=78..224, height=146, balanced 22px top & bottom padding) -->
  <!-- Card 1: Apple Mac -->
  <g transform="translate(28, 78)">
    <rect x="0" y="0" width="276" height="146" rx="14" fill="url(#macCard)" stroke="#D4B26A" stroke-width="1.5"/>
    <circle cx="252" cy="24" r="5" fill="#52D18A">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="28" fill="#F0D48C" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">APPLE SIGNED &amp; NOTARISED</text>
    <text x="20" y="58" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Apple Mac</text>
    <text x="20" y="81" fill="#E3F0E9" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">Apple Silicon (M1–M4) &amp; Intel Macs</text>
    <text x="20" y="99" fill="#C7E2D4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">Opens cleanly on first click · Auto-updates</text>
    <rect x="20" y="112" width="236" height="22" rx="11" fill="#E5C77B"/>
    <text x="138" y="126.5" text-anchor="middle" fill="#0E251C" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Download Mac Installer →</text>
  </g>

  <!-- Card 2: Windows 10 & 11 -->
  <g transform="translate(322, 78)">
    <rect x="0" y="0" width="276" height="146" rx="14" fill="url(#winCard)" stroke="#D4B26A" stroke-width="1.5"/>
    <circle cx="252" cy="24" r="5" fill="#7CC4ED">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="28" fill="#B6DCF2" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">COMPACT 5 MB INSTALLER</text>
    <text x="20" y="58" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Windows 10 &amp; 11</text>
    <text x="20" y="81" fill="#E1EFF7" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">All modern 64-bit laptops &amp; PCs</text>
    <text x="20" y="99" fill="#C2DDEC" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">No admin password needed · Auto-updates</text>
    <rect x="20" y="112" width="236" height="22" rx="11" fill="#B6DCF2"/>
    <text x="138" y="126.5" text-anchor="middle" fill="#102533" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Download Windows Setup →</text>
  </g>

  <!-- Card 3: Chromebook & Web -->
  <g transform="translate(616, 78)">
    <rect x="0" y="0" width="276" height="146" rx="14" fill="url(#chrCard)" stroke="#D4B26A" stroke-width="1.5"/>
    <circle cx="252" cy="24" r="5" fill="#F0D48C">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="28" fill="#F7DEC3" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">ZERO INSTALL · OFFLINE WEB</text>
    <text x="20" y="58" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Chromebook &amp; Web</text>
    <text x="20" y="81" fill="#FCEBE3" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">Chromebooks, Chrome, Android &amp; iPad</text>
    <text x="20" y="99" fill="#F2D1C2" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5">Opens straight in browser · Works offline</text>
    <rect x="20" y="112" width="236" height="22" rx="11" fill="#FBF8F1"/>
    <text x="138" y="126.5" text-anchor="middle" fill="#532615" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Launch Live Web App →</text>
  </g>
</svg>

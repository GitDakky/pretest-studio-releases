<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="920" height="230" role="img" aria-label="PreTest Studio — Adaptive Independent-School Preparation for macOS, Windows and Chromebook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F17"/>
      <stop offset="52%" stop-color="#143628"/>
      <stop offset="100%" stop-color="#1C4634"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0D48C"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#A67E2E"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5C77B" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#C9A24B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E5C77B" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#C9A24B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbSage" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#52D18A" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#2D5A47" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2D5A47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crestFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21503C"/>
      <stop offset="100%" stop-color="#0F2A1F"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bannerClip">
      <rect width="920" height="230" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect width="920" height="230" fill="url(#bg)"/>

    <!-- Subtle floating ambient orbs -->
    <circle cx="800" cy="60" r="105" fill="url(#orbGold)">
      <animate attributeName="cy" values="60;72;60" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="188" r="95" fill="url(#orbSage)">
      <animate attributeName="cx" values="110;126;110" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Bottom antique brass rule cleanly inside clipPath -->
    <rect x="0" y="224" width="920" height="6" fill="url(#brass)"/>

    <!-- Adaptive IRT mastery curve panel on the right (x=664..892, vertically centred) -->
    <g transform="translate(664, 30)">
      <rect x="0" y="0" width="228" height="164" rx="14" fill="#0A1E16" fill-opacity="0.88" stroke="#D4B26A" stroke-opacity="0.52" stroke-width="1.2"/>
      <text x="16" y="24" fill="#F0D48C" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">ADAPTIVE IRT ENGINE</text>
      <text x="16" y="48" fill="#E9DBB2" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">Target SAS · 3-Day Mastery</text>

      <!-- Chart gridlines: target at y=60, mid at y=92, baseline at y=124 -->
      <line x1="16" y1="60" x2="212" y2="60" stroke="#E5C77B" stroke-opacity="0.52" stroke-dasharray="4 4" stroke-width="1.1"/>
      <line x1="16" y1="92" x2="212" y2="92" stroke="#7EA893" stroke-opacity="0.28" stroke-dasharray="3 4" stroke-width="1"/>
      <line x1="16" y1="124" x2="212" y2="124" stroke="#7EA893" stroke-opacity="0.48" stroke-width="1.1"/>

      <!-- Curve starts EXACTLY on baseline (22, 124) and reaches EXACTLY on target line (206, 60) -->
      <path d="M 22 124 C 64 118, 86 98, 120 86 C 154 74, 174 64, 206 60" fill="none" stroke="url(#brass)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="22" cy="124" r="3.8" fill="#FBF8F1"/>
      <circle cx="22" cy="124" r="4.5" fill="#FBF8F1" filter="url(#softGlow)">
        <animateMotion dur="4.2s" repeatCount="indefinite" path="M 0 0 C 42 -6, 64 -26, 98 -38 C 132 -50, 152 -60, 184 -64"/>
      </circle>
      <circle cx="206" cy="60" r="5" fill="#F0D48C">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="147" fill="#D5E8DE" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">11+ Pre-Test · 13+ CE · KS3</text>
    </g>

    <!-- Heritage Crest Emblem vertically centred (y=47..177 -> centre 112) -->
    <g transform="translate(36, 47)">
      <path d="M 46 0 L 90 16 L 90 66 C 90 98 68 118 46 130 C 24 118 2 98 2 66 L 2 16 Z" fill="url(#crestFill)" stroke="#E5C77B" stroke-width="2"/>
      <path d="M 46 9 L 81 22 L 81 65 C 81 91 63 108 46 119 C 29 108 11 91 11 65 L 11 22 Z" fill="none" stroke="#C9A24B" stroke-opacity="0.42" stroke-width="1"/>
      <path d="M 22 72 C 30 66 39 67 46 73 C 53 67 62 66 70 72 L 70 92 C 62 86 53 87 46 93 C 39 87 30 86 22 92 Z" fill="#FBF8F1" fill-opacity="0.96"/>
      <line x1="46" y1="73" x2="46" y2="93" stroke="#143628" stroke-width="1.6"/>
      <polygon points="46,27 50.5,39 63,39 53,46.5 56.5,58 46,51 35.5,58 39,46.5 29,39 41.5,39" fill="#F0D48C" filter="url(#softGlow)"/>
      <circle cx="46" cy="44" r="20" fill="none" stroke="#E5C77B" stroke-opacity="0.38" stroke-width="1.2">
        <animate attributeName="r" values="18;24;18" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.48;0.1;0.48" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main Heading & Copy (strictly within x=150..638, 26px gutter before right card) -->
    <g transform="translate(150, 52)">
      <text x="0" y="0" fill="#F0D48C" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">OFFLINE-FIRST · EVIDENCE-LED · ZERO TRACKING</text>
      <text x="0" y="42" fill="#FBF8F1" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="-0.3">PreTest Studio</text>
      <text x="0" y="69" fill="#DFECE5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="500">Adaptive prep for 11+, ISEB Pre-Test &amp; 13+ Common Entrance</text>
      <!-- Divider aligns exactly to pill row width (478px) -->
      <rect x="0" y="84" width="478" height="1.5" fill="url(#goldLine)"/>

      <!-- Three Uniformly Padded Platform Pills (total width 478px: 148 + 10 + 144 + 10 + 166) -->
      <g transform="translate(0, 102)">
        <rect x="0" y="0" width="148" height="28" rx="14" fill="#0A1E16" stroke="#D4B26A" stroke-opacity="0.58" stroke-width="1"/>
        <circle cx="15" cy="14" r="4" fill="#52D18A">
          <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="27" y="18" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">macOS Notarised</text>

        <rect x="158" y="0" width="144" height="28" rx="14" fill="#0A1E16" stroke="#D4B26A" stroke-opacity="0.58" stroke-width="1"/>
        <circle cx="173" cy="14" r="4" fill="#F0D48C">
          <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <text x="185" y="18" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Windows 10 / 11</text>

        <rect x="312" y="0" width="166" height="28" rx="14" fill="#0A1E16" stroke="#D4B26A" stroke-opacity="0.58" stroke-width="1"/>
        <circle cx="327" cy="14" r="4" fill="#F09E7A">
          <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="339" y="18" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Chromebook &amp; Web</text>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="918.5" height="228.5" rx="17.5" fill="none" stroke="#D4B26A" stroke-opacity="0.38" stroke-width="1.5"/>
  </g>
</svg>
